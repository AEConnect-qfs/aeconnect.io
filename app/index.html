<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Workspace | AE Connect</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:#0a1628; --navy-mid:#112240; --teal:#00d4c8; --teal-dark:#00a896;
      --teal-muted:rgba(0,212,200,0.1); --slate:#8892a4; --light:#ccd6f6; --white:#e6f1ff;
      --border:rgba(255,255,255,0.08); --card-bg:rgba(255,255,255,0.03);
      --amber:#f5c842; --red:#ff6b6b; --green:#4ade80;
    }
    body { font-family:'Inter',sans-serif; background:var(--navy); color:var(--light); line-height:1.6; min-height:100vh; }
    a { color:var(--teal); text-decoration:none; }
    button { font-family:inherit; cursor:pointer; }
    .hidden { display:none !important; }

    /* Topbar */
    .topbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
      padding:0 28px; height:60px; background:rgba(10,22,40,0.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .brand { font-size:17px; font-weight:700; color:var(--white); letter-spacing:-0.3px; }
    .brand span { color:var(--teal); }
    .brand .sub { font-size:12px; font-weight:500; color:var(--slate); margin-left:10px; padding-left:10px; border-left:1px solid var(--border); }
    .top-right { display:flex; align-items:center; gap:16px; font-size:13px; }
    .usage-pill { display:flex; align-items:center; gap:8px; padding:5px 12px; border-radius:20px; background:var(--card-bg); border:1px solid var(--border); font-size:12.5px; }
    .usage-pill .dot { width:7px; height:7px; border-radius:50%; background:var(--teal); }
    .usage-pill.warn { border-color:rgba(245,200,66,0.4); background:rgba(245,200,66,0.08); }
    .usage-pill.warn .dot { background:var(--amber); }
    .btn { border:none; border-radius:6px; padding:8px 16px; font-size:13px; font-weight:600; transition:opacity .15s, transform .1s; }
    .btn:active { transform:translateY(1px); }
    .btn-primary { background:var(--teal); color:var(--navy); }
    .btn-primary:hover { opacity:.9; }
    .btn-ghost { background:transparent; color:var(--slate); border:1px solid var(--border); }
    .btn-ghost:hover { color:var(--white); }
    .btn-amber { background:linear-gradient(135deg,#e8a910,#f5c842); color:var(--navy); font-weight:700; }
    .btn-sm { padding:5px 11px; font-size:12px; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }

    /* Auth */
    .auth-wrap { max-width:400px; margin:8vh auto; padding:0 20px; }
    .auth-card { background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:32px; }
    .auth-card h1 { font-size:22px; color:var(--white); margin-bottom:6px; }
    .auth-card p.sub { font-size:13.5px; color:var(--slate); margin-bottom:22px; }
    .tabs { display:flex; gap:4px; background:rgba(0,0,0,0.25); padding:4px; border-radius:8px; margin-bottom:20px; }
    .tabs button { flex:1; padding:8px; border:none; background:transparent; color:var(--slate); font-size:13px; font-weight:600; border-radius:6px; }
    .tabs button.active { background:var(--teal); color:var(--navy); }
    label { display:block; font-size:12px; font-weight:600; color:var(--slate); margin:14px 0 6px; }
    input, textarea, select { width:100%; padding:10px 12px; background:rgba(0,0,0,0.25); border:1px solid var(--border);
      border-radius:7px; color:var(--white); font-size:13.5px; font-family:inherit; }
    input:focus, textarea:focus { outline:none; border-color:var(--teal); }
    textarea { resize:vertical; min-height:120px; line-height:1.55; }
    .err { color:var(--red); font-size:12.5px; margin-top:12px; min-height:16px; }
    .full { width:100%; margin-top:20px; }

    /* App layout */
    .layout { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - 60px); }
    .sidebar { border-right:1px solid var(--border); padding:18px; overflow-y:auto; }
    .sidebar h3 { font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate); margin-bottom:12px; }
    .case-item { padding:11px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; cursor:pointer; transition:border-color .15s, background .15s; }
    .case-item:hover { border-color:var(--teal-dark); }
    .case-item.active { border-color:var(--teal); background:var(--teal-muted); }
    .case-item .ref { font-size:11px; color:var(--slate); font-weight:600; letter-spacing:0.03em; }
    .case-item .ttl { font-size:13.5px; color:var(--white); margin:2px 0 4px; }
    .main { padding:26px 32px; overflow-y:auto; max-width:960px; }

    .badge { display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:11px; letter-spacing:0.04em; text-transform:uppercase; }
    .b-pending { background:rgba(136,146,164,0.18); color:var(--slate); }
    .b-review  { background:rgba(0,212,200,0.14); color:var(--teal); }
    .b-cleared { background:rgba(74,222,128,0.15); color:var(--green); }
    .conf { font-size:10px; font-weight:700; padding:1px 7px; border-radius:9px; text-transform:uppercase; letter-spacing:0.03em; }
    .conf-high { background:rgba(74,222,128,0.15); color:var(--green); }
    .conf-medium { background:rgba(245,200,66,0.15); color:var(--amber); }
    .conf-low { background:rgba(255,107,107,0.16); color:var(--red); }

    .card { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:18px; }
    .card h2 { font-size:15px; color:var(--white); margin-bottom:4px; }
    .card .hint { font-size:12.5px; color:var(--slate); margin-bottom:14px; }

    /* Field rows */
    .field { border:1px solid var(--border); border-radius:9px; padding:13px 15px; margin-bottom:10px; }
    .field.needs { border-color:rgba(255,107,107,0.35); }
    .field.decided { border-color:rgba(74,222,128,0.3); }
    .field-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .field-label { font-size:12px; font-weight:600; color:var(--slate); }
    .field-val { font-size:14px; color:var(--white); margin-top:5px; word-break:break-word; }
    .field-actions { display:flex; gap:7px; margin-top:11px; align-items:center; }
    .field-status { font-size:11.5px; font-weight:600; }
    .field-status.ok { color:var(--green); }
    .field-status.over { color:var(--amber); }
    .override-box { margin-top:9px; display:none; }
    .override-box textarea { min-height:60px; }

    .signoff-cleared { background:rgba(74,222,128,0.07); border:1px solid rgba(74,222,128,0.3); border-radius:12px; padding:20px; }
    .signoff-cleared .chk { font-size:15px; color:var(--green); font-weight:700; margin-bottom:8px; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--slate); word-break:break-all; }
    .empty { color:var(--slate); font-size:14px; text-align:center; margin-top:80px; }
    .row { display:flex; gap:10px; align-items:center; }
    .banner { padding:12px 16px; border-radius:9px; font-size:13px; margin-bottom:16px; }
    .banner-warn { background:rgba(245,200,66,0.1); border:1px solid rgba(245,200,66,0.35); color:var(--amber); }
    .disclaimer { font-size:11.5px; color:var(--slate); background:rgba(0,0,0,0.2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; margin-bottom:16px; }
    /* Auth modal overlay */
    .modal-overlay { position:fixed; inset:0; background:rgba(5,12,24,0.74); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
    .modal-overlay.hidden { display:none; }
    .modal-card { background:var(--navy-mid); border:1px solid var(--border); border-radius:14px; padding:28px; width:100%; max-width:410px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    .modal-card h1 { font-size:20px; color:var(--white); margin-bottom:4px; }
    .modal-card .sub { font-size:13px; color:var(--slate); margin-bottom:18px; line-height:1.5; }
    .modal-close { position:absolute; top:10px; right:14px; background:none; border:none; color:var(--slate); font-size:22px; line-height:1; cursor:pointer; }
    .modal-close:hover { color:var(--white); }
    @media (max-width:760px){ .layout{ grid-template-columns:1fr; } .sidebar{ border-right:none; border-bottom:1px solid var(--border);} }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <a href="/" class="brand">AE <span>Connect</span><span class="sub">AI Workspace</span></a>
    </div>
    <div class="top-right" id="topRight"></div>
  </div>

  <!-- AUTH MODAL (shown on demand) -->
  <div id="authModal" class="modal-overlay hidden" onclick="if(event.target===this)closeAuth()">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAuth()" aria-label="Close">×</button>
      <h1>Save your assessment</h1>
      <p class="sub" id="authSubtitle">Create your free account to see the AI assessment. First 5 cases free — no card.</p>
      <div class="tabs">
        <button id="tabSignup" class="active" onclick="setMode('signup')">Sign up</button>
        <button id="tabLogin" onclick="setMode('login')">Log in</button>
      </div>
      <div id="nameField">
        <label>Full name</label>
        <input id="f_name" placeholder="Dr. Jane Doe" />
      </div>
      <label>Email</label>
      <input id="f_email" type="email" placeholder="you@company.com" />
      <label>Password</label>
      <input id="f_password" type="password" placeholder="••••••••" />
      <button class="btn btn-primary full" id="authBtn" onclick="submitAuth()">Create account</button>
      <div class="err" id="authErr"></div>
    </div>
  </div>

  <!-- APP VIEW (always shown — workspace is the landing page) -->
  <div id="appView" class="layout">
    <aside class="sidebar">
      <button class="btn btn-primary" style="width:100%;margin-bottom:16px" onclick="newCase()">+ New case</button>
      <h3>Your cases</h3>
      <div id="caseList"></div>
    </aside>
    <main class="main" id="mainPanel"></main>
  </div>

  <script>
  // ── API helper ────────────────────────────────────────────────
  const API = '';
  let token = localStorage.getItem('ae_token') || '';
  let user = null, usage = null, cases = [], current = null, mode = 'signup', ncSourceType = 'text', pendingSource = null;

  async function api(path, method = 'GET', body) {
    const res = await fetch(API + path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await res.json(); } catch {}
    return { status: res.status, ok: res.ok, data };
  }
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  // ── Auth ──────────────────────────────────────────────────────
  function setMode(m) {
    mode = m;
    tabLogin.classList.toggle('active', m === 'login');
    tabSignup.classList.toggle('active', m === 'signup');
    nameField.classList.toggle('hidden', m !== 'signup');
    authBtn.textContent = m === 'login' ? 'Log in' : 'Create account';
    authErr.textContent = '';
  }
  function openAuth(m, subtitle) {
    authModal.classList.remove('hidden');
    document.getElementById('authSubtitle').textContent = subtitle || 'Log in or create your free account. First 5 cases free — no card.';
    setMode(m || 'signup');
    setTimeout(() => { (mode === 'signup' ? f_name : f_email).focus(); }, 60);
  }
  function closeAuth() { authModal.classList.add('hidden'); if (authErr) authErr.textContent = ''; }

  async function submitAuth() {
    authErr.textContent = '';
    const email = f_email.value.trim(), password = f_password.value, name = f_name.value.trim();
    if (!email || !password) { authErr.textContent = 'Email and password are required.'; return; }
    if (mode === 'signup' && !name) { authErr.textContent = 'Please enter your name.'; return; }
    const path = mode === 'login' ? '/api/login' : '/api/signup';
    const r = await api(path, 'POST', mode === 'login' ? { email, password } : { email, password, name });
    if (!r.ok) { authErr.textContent = r.data.error || 'Something went wrong.'; return; }
    token = r.data.token; localStorage.setItem('ae_token', token);
    closeAuth();
    await boot();
  }
  function logout() { token = ''; localStorage.removeItem('ae_token'); location.reload(); }

  // ── Boot ──────────────────────────────────────────────────────
  async function boot() {
    const me = await api('/api/me');
    if (!me.ok) {
      // Guest: workspace is the landing page; auth is deferred until they run an assessment.
      token = ''; localStorage.removeItem('ae_token'); user = null; usage = null;
      renderTop(); guestLanding();
      return;
    }
    user = me.data;
    renderTop();
    await refreshUsage();
    await handleCheckoutReturn();
    await loadCases();
    if (pendingSource) { const s = pendingSource; pendingSource = null; await createAndAssess(s); }
    else if (cases.length) selectCase(cases[0].id);
    else showEmpty();
  }

  async function handleCheckoutReturn() {
    const params = new URLSearchParams(location.search);
    if (!params.get('checkout')) return;
    const sid = params.get('session_id');
    history.replaceState({}, '', '/app');
    if (params.get('checkout') === 'success' && sid) {
      await api('/api/checkout-confirm', 'POST', { sessionId: sid });
    }
    await refreshUsage();
  }

  function renderTop() {
    if (!user) {
      topRight.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="openAuth('login')">Log in</button><button class="btn btn-primary btn-sm" onclick="openAuth('signup')">Sign up</button>`;
      return;
    }
    let pill = '';
    if (usage) {
      if (usage.plan === 'trial') {
        const rem = usage.trial.remaining;
        pill = `<div class="usage-pill ${rem <= 1 ? 'warn' : ''}"><span class="dot"></span>Free trial · ${usage.trial.used}/${usage.trial.limit} used</div>`;
      } else {
        pill = `<div class="usage-pill"><span class="dot"></span>Core · ${usage.casesProcessed}/${usage.includedPerMonth} this month${usage.overageCases ? ' · +' + usage.overageCases + ' overage' : ''} · ${usage.estimatedAmountDue}</div>`;
      }
    }
    const sub = usage && usage.plan === 'trial'
      ? `<button class="btn btn-amber btn-sm" onclick="subscribe()">Subscribe · $20/mo</button>` : '';
    topRight.innerHTML = `${pill}${sub}<span style="color:var(--slate)">${esc(user.name)}</span><button class="btn btn-ghost btn-sm" onclick="logout()">Log out</button>`;
  }

  async function refreshUsage() { const r = await api('/api/usage'); if (r.ok) usage = r.data; renderTop(); }
  async function subscribe() {
    const r = await api('/api/create-checkout-session', 'POST', {});
    if (!r.ok) { alert(r.data.error || 'Subscription failed'); return; }
    if (r.data.url) { window.location.href = r.data.url; return; } // → Stripe Checkout
    // Dev fallback / already subscribed: plan activated server-side.
    if (r.data.plan) usage = r.data;
    await refreshUsage(); if (current) renderCase();
  }

  // ── Cases ─────────────────────────────────────────────────────
  async function loadCases() {
    const r = await api('/api/cases'); cases = r.ok ? r.data.cases : []; renderCaseList();
  }
  function renderCaseList() {
    caseList.innerHTML = cases.map((c) => `
      <div class="case-item ${current && current.id === c.id ? 'active' : ''}" onclick="selectCase('${c.id}')">
        <div class="ref">${esc(c.caseRef)}</div>
        <div class="ttl">${esc(c.title)}</div>
        <span class="badge b-${badgeClass(c.status)}">${statusLabel(c.status)}</span>
      </div>`).join('') || `<p style="color:var(--slate);font-size:13px">No cases yet.</p>`;
  }
  const badgeClass = (s) => s === 'cleared' ? 'cleared' : s === 'in_review' || s === 'ai_drafted' ? 'review' : 'pending';
  const statusLabel = (s) => ({ pending:'Pending', ai_drafted:'AI drafted', in_review:'In review', cleared:'Cleared' }[s] || s);

  async function selectCase(id) {
    const r = await api('/api/cases?id=' + id);
    if (!r.ok) return;
    current = r.data; renderCaseList(); renderCase();
  }

  // ── Guest landing (anonymous) ─────────────────────────────────
  function guestLanding() {
    current = null; ncSourceType = 'text'; renderCaseList();
    mainPanel.innerHTML = `
      <div class="card" style="max-width:720px;margin:8px auto 0">
        <h2 style="font-size:20px">AI adverse-event case processing</h2>
        <p class="hint">Paste an adverse-event source document — or upload a PDF, Word, image/scan or email — and the AI drafts a structured assessment: seriousness, MedDRA coding, causality, expectedness, and regulatory timeline. You review and sign off. <strong>First 5 cases free — no card.</strong></p>
        <label>Source document</label>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
          <input type="file" id="nc_file" accept=".pdf,.doc,.docx,.txt,.eml,.csv,.md,.json,.png,.jpg,.jpeg,.webp,.gif,.tif,.tiff" onchange="onFileChosen(this.files[0])" style="display:none" />
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('nc_file').click()">📎 Choose file…</button>
          <span id="nc_filestatus" style="font-size:12.5px;color:var(--slate)"></span>
        </div>
        <label>Extracted / pasted text</label>
        <textarea id="nc_text" placeholder="Paste the adverse-event narrative, or upload a file above to auto-extract..."></textarea>
        <label>Case title (optional)</label>
        <input id="nc_title" placeholder="e.g. Headache after Cardizem XL" />
        <button class="btn btn-primary full" onclick="guestRun()">🚀 Run AI assessment</button>
        <div class="err" id="nc_err"></div>
        <p style="font-size:11.5px;color:var(--slate);margin-top:12px">Files are read in your browser — only the extracted text is sent. Decision support only: the AI draft is not a regulatory action; a qualified reviewer signs off every case.</p>
      </div>`;
  }
  function guestRun() {
    const title = document.getElementById('nc_title').value.trim();
    const sourceText = document.getElementById('nc_text').value.trim();
    if (!sourceText) { document.getElementById('nc_err').textContent = 'Add a source document or paste text first.'; return; }
    pendingSource = { title, sourceText, sourceType: ncSourceType };
    openAuth('signup', 'Create your free account to run this assessment and see the result. First 5 cases free — no card.');
  }
  async function createAndAssess(s) {
    mainPanel.innerHTML = `<div class="empty">🧠 Running AI assessment…</div>`;
    const c = await api('/api/cases', 'POST', { title: s.title, sourceText: s.sourceText, sourceType: s.sourceType });
    if (!c.ok) { showEmpty(); alert(c.data.error || 'Failed to create case'); return; }
    const a = await api('/api/assess', 'POST', { caseId: c.data.id });
    await refreshUsage();
    await loadCases();
    await selectCase(c.data.id);
    if (a.status === 402) alert(a.data.error || 'Trial exhausted — subscribe to continue.');
  }

  function newCase() {
    if (!user) { guestLanding(); return; }
    current = null; ncSourceType = 'text'; renderCaseList();
    mainPanel.innerHTML = `
      <div class="card">
        <h2>New case</h2>
        <p class="hint">Upload a source document — PDF, Word, image/scan, email or text — or paste the text. Files are read in your browser; only the extracted text is sent. The AI then drafts a structured assessment you review.</p>
        <label>Source document</label>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
          <input type="file" id="nc_file" accept=".pdf,.doc,.docx,.txt,.eml,.csv,.md,.json,.png,.jpg,.jpeg,.webp,.gif,.tif,.tiff" onchange="onFileChosen(this.files[0])" style="display:none" />
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('nc_file').click()">📎 Choose file…</button>
          <span id="nc_filestatus" style="font-size:12.5px;color:var(--slate)"></span>
        </div>
        <label>Extracted / pasted text</label>
        <textarea id="nc_text" placeholder="Paste the narrative, or upload a file above to auto-extract..."></textarea>
        <label>Case title (optional)</label>
        <input id="nc_title" placeholder="e.g. Headache after Cardizem XL" />
        <button class="btn btn-primary full" onclick="createCase()">Create case</button>
        <div class="err" id="nc_err"></div>
      </div>`;
  }
  async function createCase() {
    const title = document.getElementById('nc_title').value.trim();
    const sourceText = document.getElementById('nc_text').value.trim();
    if (!sourceText) { document.getElementById('nc_err').textContent = 'Source text is required — upload a file or paste text.'; return; }
    const r = await api('/api/cases', 'POST', { title, sourceText, sourceType: ncSourceType });
    if (!r.ok) { document.getElementById('nc_err').textContent = r.data.error || 'Failed'; return; }
    await loadCases(); await selectCase(r.data.id);
  }
  function showEmpty() { mainPanel.innerHTML = `<div class="empty">Select a case, or create your first one.</div>`; }

  // ── Case detail / assessment ──────────────────────────────────
  const FIELDS = [
    ['seriousness','Seriousness'], ['meddraPt','MedDRA Preferred Term'], ['meddraCode','MedDRA Code'],
    ['soc','System Organ Class'], ['causality','Causality'], ['expectedness','Expectedness'],
    ['regulatoryRequired','Regulatory Reporting Required'], ['regulatoryTimeline','Reporting Timeline'], ['narrative','Narrative'],
  ];

  function decisionFor(fieldKey) {
    if (!current) return null;
    const d = (current.fieldDecisions || []).filter((x) => x.fieldKey === fieldKey);
    return d.length ? d[0] : null; // most recent first (ordered desc by API)
  }

  function renderCase() {
    const c = current; if (!c) return;
    const a = c.assessment;
    let html = `
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div><div style="font-size:12px;color:var(--slate);font-weight:600">${esc(c.caseRef)}</div>
        <h2 style="font-size:19px;color:var(--white)">${esc(c.title)}</h2></div>
        <span class="badge b-${badgeClass(c.status)}">${statusLabel(c.status)}</span>
      </div>
      <div class="disclaimer">⚠ Decision support only — the AI draft is not a regulatory action. A qualified reviewer reviews and approves every case before any downstream use.</div>
      <div class="card"><h2>Source document</h2><div class="hint" style="margin:0">${esc(c.sourceText)}</div></div>`;

    if (!a) {
      const blocked = usage && usage.plan === 'trial' && usage.trial.remaining <= 0;
      html += `<div class="card"><h2>AI assessment</h2>
        <p class="hint">Run the AI engine to draft the structured assessment.</p>
        ${blocked ? `<div class="banner banner-warn">Your free trial is used up. Subscribe to Core to process this case.</div>
          <button class="btn btn-amber" onclick="subscribe()">Subscribe · $20/mo</button>`
          : `<button class="btn btn-primary" id="assessBtn" onclick="runAssess()">🚀 Run AI assessment</button>`}
        <div class="err" id="assessErr"></div></div>`;
      mainPanel.innerHTML = html;
      return;
    }

    // Assessment present → field review
    html += `<div class="card"><h2>AI-drafted assessment · <span style="color:var(--slate);font-weight:500">model ${esc(currentModelVersion())}</span></h2>
      <p class="hint">Review each field. Accept the AI value or override it. Low-confidence fields are flagged.</p>`;

    for (const [key, label] of FIELDS) {
      const aiVal = key === 'authorities' ? (a.authorities || []).join(', ') : a[key];
      const conf = (a.confidence && a.confidence[key]) || null;
      const dec = decisionFor(key);
      const needs = conf === 'low' && !dec;
      html += `<div class="field ${dec ? 'decided' : ''} ${needs ? 'needs' : ''}">
        <div class="field-top">
          <span class="field-label">${label}</span>
          ${conf ? `<span class="conf conf-${conf}">${conf} confidence</span>` : ''}
        </div>
        <div class="field-val">${esc(dec ? dec.finalValue : aiVal)}</div>`;
      if (dec) {
        html += `<div class="field-actions"><span class="field-status ${dec.decisionType === 'override' ? 'over' : 'ok'}">
          ${dec.decisionType === 'override' ? '✎ Overridden' : '✓ Accepted'}</span>
          <button class="btn btn-ghost btn-sm" onclick="startOverride('${key}')">Change</button></div>`;
      } else {
        html += `<div class="field-actions">
          <button class="btn btn-primary btn-sm" onclick="accept('${key}', ${JSON.stringify(aiVal).replace(/"/g,'&quot;')})">Accept</button>
          <button class="btn btn-ghost btn-sm" onclick="startOverride('${key}')">Override</button></div>`;
      }
      html += `<div class="override-box" id="ov_${key}">
        <textarea id="ovval_${key}">${esc(dec ? dec.finalValue : aiVal)}</textarea>
        <input id="ovreason_${key}" placeholder="Reason for override (optional)" style="margin-top:7px" />
        <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="saveOverride('${key}', ${JSON.stringify(aiVal).replace(/"/g,'&quot;')})">Save override</button>
      </div></div>`;
    }
    html += `</div>`;

    // Download & regulatory export
    html += `<div class="card"><h2>Download &amp; export</h2>
      <p class="hint">Download the reviewed case as a printable file, or request a regulatory-format export.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="btn btn-primary" onclick="downloadCase()">⬇ Download case</button>
        <button class="btn btn-ghost" onclick="requestExport('E2B (R3)')">E2B (R3) →</button>
        <button class="btn btn-ghost" onclick="requestExport('CIOMS I')">CIOMS I →</button>
        <button class="btn btn-ghost" onclick="requestExport('MedWatch 3500A')">MedWatch 3500A →</button>
        <button class="btn btn-ghost" onclick="requestExport('PSUR / PBRER')">PSUR / PBRER →</button>
      </div>
      <p style="font-size:11.5px;color:var(--slate);margin-top:10px">E2B(R3), CIOMS, MedWatch and PSUR are add-on modules in the full AE Connect platform — click to request access and we'll set you up.</p></div>`;

    mainPanel.innerHTML = html;
  }
  function currentModelVersion() { return (current && current.assessment && current.assessment.modelVersion) || 'ai'; }

  function downloadCase() {
    const c = current; if (!c || !c.assessment) return;
    const a = c.assessment;
    const rows = FIELDS.map(([key, label]) => {
      const aiVal = key === 'authorities' ? (a.authorities || []).join(', ') : a[key];
      const dec = decisionFor(key);
      const finalVal = dec ? dec.finalValue : aiVal;
      const review = dec ? (dec.decisionType === 'override' ? 'Overridden' + (dec.reason ? ' — ' + dec.reason : '') : 'Accepted') : 'AI draft (not yet reviewed)';
      const conf = (a.confidence && a.confidence[key]) || '';
      return `<tr><th>${esc(label)}</th><td>${esc(finalVal)}</td><td>${esc(review)}${conf ? ' · ' + esc(conf) + ' conf' : ''}</td></tr>`;
    }).join('');
    const doc = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(c.caseRef)} — AE Connect</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1a202c;max-width:760px;margin:32px auto;padding:0 20px;line-height:1.5}
h1{font-size:20px;margin:0 0 2px}.ref{color:#718096;font-size:12px;font-weight:700;letter-spacing:.03em}
.meta{color:#718096;font-size:12px;margin-bottom:18px}h2{font-size:14px;margin:22px 0 6px}
.src{background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:13px;vertical-align:top}
thead th{color:#4a5568}tbody th{width:210px;color:#4a5568;font-weight:600}
.disc{color:#718096;font-size:11px;margin-top:22px;border-top:1px solid #e2e8f0;padding-top:10px}</style></head>
<body>
<div class="ref">${esc(c.caseRef)}</div>
<h1>${esc(c.title)}</h1>
<div class="meta">AE Connect · AI-assisted assessment · model ${esc(a.modelVersion || currentModelVersion())} · generated ${new Date().toLocaleString()}</div>
<h2>Source document</h2>
<div class="src">${esc(c.sourceText)}</div>
<h2>Structured assessment</h2>
<table><thead><tr><th>Field</th><th>Final value</th><th>Review</th></tr></thead><tbody>${rows}</tbody></table>
<div class="disc">Decision support only — this AI-assisted draft is not a regulatory action; it was reviewed and approved by a qualified user. AE Connect by QORO Intelligence.</div>
</body></html>`;
    const url = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
    const link = document.createElement('a');
    link.href = url; link.download = `${c.caseRef}.html`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // Regulatory-format exports are add-on modules in the full AE Connect platform —
  // route the request to the contact form (with the format prefilled).
  function requestExport(format) {
    window.open('https://aeconnect.io/contact?export=' + encodeURIComponent(format), '_blank');
  }

  async function runAssess() {
    const btn = document.getElementById('assessBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Assessing…'; }
    const r = await api('/api/assess', 'POST', { caseId: current.id });
    if (r.status === 402) { await refreshUsage(); document.getElementById('assessErr').textContent = r.data.error; renderCase(); return; }
    if (!r.ok) { document.getElementById('assessErr').textContent = r.data.error || 'Assessment failed'; if (btn){btn.disabled=false;btn.textContent='🚀 Run AI assessment';} return; }
    await refreshUsage(); await selectCase(current.id); await loadCases();
  }

  async function accept(key, aiVal) {
    const r = await api('/api/field-decision', 'POST', { caseId: current.id, fieldKey: key, decisionType: 'accept', aiValue: String(aiVal) });
    if (r.ok) await selectCase(current.id); else alert(r.data.error || 'Failed');
  }
  function startOverride(key) { const box = document.getElementById('ov_' + key); if (box) box.style.display = box.style.display === 'block' ? 'none' : 'block'; }
  async function saveOverride(key, aiVal) {
    const finalValue = document.getElementById('ovval_' + key).value;
    const reason = document.getElementById('ovreason_' + key).value;
    const r = await api('/api/field-decision', 'POST', { caseId: current.id, fieldKey: key, decisionType: 'override', aiValue: String(aiVal), finalValue, reason });
    if (r.ok) await selectCase(current.id); else alert(r.data.error || 'Failed');
  }

  // ── File ingestion (client-side; PHI stays in the browser) ────
  const CDN = {
    pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
    mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js',
  };
  const _scripts = {};
  function loadScript(url) {
    if (_scripts[url]) return _scripts[url];
    _scripts[url] = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = url; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + url));
      document.head.appendChild(s);
    });
    return _scripts[url];
  }
  function fstatus(msg) { const el = document.getElementById('nc_filestatus'); if (el) el.textContent = msg; }

  async function onFileChosen(file) {
    if (!file) return;
    const name = file.name, ext = (name.split('.').pop() || '').toLowerCase();
    const titleEl = document.getElementById('nc_title');
    if (titleEl && !titleEl.value.trim()) titleEl.value = name.replace(/\.[^.]+$/, '');
    try {
      let text = '';
      if (['txt', 'eml', 'csv', 'md', 'json'].includes(ext) || (file.type || '').startsWith('text/')) {
        fstatus('Reading ' + name + '…'); text = await file.text(); ncSourceType = ext === 'eml' ? 'email' : 'text';
      } else if (ext === 'pdf') {
        text = await extractPdf(file); ncSourceType = 'pdf';
      } else if (ext === 'docx' || ext === 'doc') {
        fstatus('Extracting Word document…'); await loadScript(CDN.mammoth);
        text = (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value || ''; ncSourceType = 'word';
      } else if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'tif', 'tiff'].includes(ext) || (file.type || '').startsWith('image/')) {
        text = await ocrImage(file); ncSourceType = 'image';
      } else { fstatus('Unsupported file type — paste the text instead.'); return; }
      text = (text || '').trim();
      document.getElementById('nc_text').value = text;
      fstatus(text ? `✓ Extracted ${text.length} characters from ${name}` : 'No text found — if this is a scan, upload it as an image for OCR.');
    } catch (e) { fstatus('Extraction failed: ' + (e.message || e)); }
  }

  async function extractPdf(file) {
    fstatus('Loading PDF engine…'); await loadScript(CDN.pdfjs);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
    const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const parts = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      fstatus(`Reading PDF page ${p}/${pdf.numPages}…`);
      const tc = await (await pdf.getPage(p)).getTextContent();
      parts.push(tc.items.map((i) => i.str).join(' '));
    }
    let text = parts.join('\n').trim();
    if (text.length < 20) { fstatus('No embedded text — running OCR on scanned pages…'); text = await ocrPdf(pdf); }
    return text;
  }

  async function ocrPdf(pdf) {
    await loadScript(CDN.tesseract);
    const worker = await window.Tesseract.createWorker('eng');
    const out = [];
    try {
      for (let p = 1; p <= pdf.numPages; p++) {
        fstatus(`OCR page ${p}/${pdf.numPages}…`);
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 2 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        out.push((await worker.recognize(canvas)).data.text);
      }
    } finally { await worker.terminate(); }
    return out.join('\n').trim();
  }

  async function ocrImage(file) {
    fstatus('Loading OCR engine…'); await loadScript(CDN.tesseract);
    const worker = await window.Tesseract.createWorker('eng', 1, {
      logger: (m) => { if (m.status === 'recognizing text') fstatus('OCR… ' + Math.round(m.progress * 100) + '%'); },
    });
    try { return (await worker.recognize(file)).data.text || ''; }
    finally { await worker.terminate(); }
  }

  // init — workspace is always the landing page; boot() decides guest vs. signed-in.
  boot();
  </script>
</body>
</html>
