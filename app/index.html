<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AE Connect — AI adverse-event case processing</title>
  <meta name="description" content="Paste or upload an adverse-event source document and AI drafts a structured pharmacovigilance assessment — seriousness, MedDRA coding, causality, regulatory timeline — for you to review. First 5 cases free." />
  <link rel="canonical" href="https://aeconnect.io/app" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:#0a1628; --navy-mid:#112240; --teal:#00d4c8; --teal-dark:#00a896;
      --teal-muted:rgba(0,212,200,0.1); --slate:#8892a4; --light:#ccd6f6; --white:#e6f1ff;
      --border:rgba(255,255,255,0.08); --card-bg:rgba(255,255,255,0.03);
      --amber:#f5c842; --red:#ff6b6b; --green:#4ade80;
    }
    body { font-family:'Inter',sans-serif; background:var(--navy); color:var(--light); line-height:1.6; min-height:100vh; }
    a { color:var(--teal); text-decoration:none; }
    button { font-family:inherit; cursor:pointer; }
    .hidden { display:none !important; }

    /* Topbar */
    .topbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
      padding:0 28px; height:60px; background:rgba(10,22,40,0.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .brand { font-size:17px; font-weight:700; color:var(--white); letter-spacing:-0.3px; }
    .brand span { color:var(--teal); }
    .brand .sub { font-size:12px; font-weight:500; color:var(--slate); margin-left:10px; padding-left:10px; border-left:1px solid var(--border); }
    .top-right { display:flex; align-items:center; gap:16px; font-size:13px; }
    .usage-pill { display:flex; align-items:center; gap:8px; padding:5px 12px; border-radius:20px; background:var(--card-bg); border:1px solid var(--border); font-size:12.5px; }
    .usage-pill .dot { width:7px; height:7px; border-radius:50%; background:var(--teal); }
    .usage-pill.warn { border-color:rgba(245,200,66,0.4); background:rgba(245,200,66,0.08); }
    .usage-pill.warn .dot { background:var(--amber); }
    .btn { border:none; border-radius:6px; padding:8px 16px; font-size:13px; font-weight:600; transition:opacity .15s, transform .1s; }
    .btn:active { transform:translateY(1px); }
    .btn-primary { background:var(--teal); color:var(--navy); }
    .btn-primary:hover { opacity:.9; }
    .btn-ghost { background:transparent; color:var(--slate); border:1px solid var(--border); }
    .btn-ghost:hover { color:var(--white); }
    .btn-amber { background:linear-gradient(135deg,#e8a910,#f5c842); color:var(--navy); font-weight:700; }
    .btn-sm { padding:5px 11px; font-size:12px; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }

    /* Auth */
    .auth-wrap { max-width:400px; margin:8vh auto; padding:0 20px; }
    .auth-card { background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:32px; }
    .auth-card h1 { font-size:22px; color:var(--white); margin-bottom:6px; }
    .auth-card p.sub { font-size:13.5px; color:var(--slate); margin-bottom:22px; }
    .tabs { display:flex; gap:4px; background:rgba(0,0,0,0.25); padding:4px; border-radius:8px; margin-bottom:20px; }
    .tabs button { flex:1; padding:8px; border:none; background:transparent; color:var(--slate); font-size:13px; font-weight:600; border-radius:6px; }
    .tabs button.active { background:var(--teal); color:var(--navy); }
    label { display:block; font-size:12px; font-weight:600; color:var(--slate); margin:14px 0 6px; }
    input, textarea, select { width:100%; padding:10px 12px; background:rgba(0,0,0,0.25); border:1px solid var(--border);
      border-radius:7px; color:var(--white); font-size:13.5px; font-family:inherit; }
    input:focus, textarea:focus { outline:none; border-color:var(--teal); }
    textarea { resize:vertical; min-height:120px; line-height:1.55; }
    .err { color:var(--red); font-size:12.5px; margin-top:12px; min-height:16px; }
    .full { width:100%; margin-top:20px; }
    .text-btn { background:none; border:none; color:var(--teal); font-size:12.5px; font-weight:600; padding:0; margin-top:14px; }
    .text-btn:hover { text-decoration:underline; }

    /* App layout */
    .layout { display:grid; grid-template-columns:300px 1fr; min-height:calc(100vh - 60px); }
    .sidebar { border-right:1px solid var(--border); padding:18px; overflow-y:auto; }
    .sidebar h3 { font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--slate); margin-bottom:12px; }
    .case-item { padding:11px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; cursor:pointer; transition:border-color .15s, background .15s; }
    .case-item:hover { border-color:var(--teal-dark); }
    .case-item.active { border-color:var(--teal); background:var(--teal-muted); }
    .case-item .ref { font-size:11px; color:var(--slate); font-weight:600; letter-spacing:0.03em; }
    .case-item .ttl { font-size:13.5px; color:var(--white); margin:2px 0 4px; }
    .main { padding:26px 32px; overflow-y:auto; max-width:960px; }

    .badge { display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:11px; letter-spacing:0.04em; text-transform:uppercase; }
    .b-pending { background:rgba(136,146,164,0.18); color:var(--slate); }
    .b-review  { background:rgba(0,212,200,0.14); color:var(--teal); }
    .b-cleared { background:rgba(74,222,128,0.15); color:var(--green); }
    .conf { font-size:10px; font-weight:700; padding:1px 7px; border-radius:9px; text-transform:uppercase; letter-spacing:0.03em; }
    .conf-high { background:rgba(74,222,128,0.15); color:var(--green); }
    .conf-medium { background:rgba(245,200,66,0.15); color:var(--amber); }
    .conf-low { background:rgba(255,107,107,0.16); color:var(--red); }

    .card { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:18px; }
    .card h2 { font-size:15px; color:var(--white); margin-bottom:4px; }
    .card .hint { font-size:12.5px; color:var(--slate); margin-bottom:14px; }

    /* Field rows */
    .field { border:1px solid var(--border); border-radius:9px; padding:13px 15px; margin-bottom:10px; }
    .field.needs { border-color:rgba(255,107,107,0.35); }
    .field.decided { border-color:rgba(74,222,128,0.3); }
    .field-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .field-label { font-size:12px; font-weight:600; color:var(--slate); }
    .field-val { font-size:14px; color:var(--white); margin-top:5px; word-break:break-word; }
    .field-actions { display:flex; gap:7px; margin-top:11px; align-items:center; }
    .field-status { font-size:11.5px; font-weight:600; }
    .field-status.ok { color:var(--green); }
    .field-status.over { color:var(--amber); }
    .override-box { margin-top:9px; display:none; }
    .override-box textarea { min-height:60px; }

    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--slate); word-break:break-all; }
    .empty { color:var(--slate); font-size:14px; text-align:center; margin-top:80px; }
    .row { display:flex; gap:10px; align-items:center; }
    .banner { padding:12px 16px; border-radius:9px; font-size:13px; margin-bottom:16px; }
    .banner-warn { background:rgba(245,200,66,0.1); border:1px solid rgba(245,200,66,0.35); color:var(--amber); }
    .disclaimer { font-size:11.5px; color:var(--slate); background:rgba(0,0,0,0.2); border:1px solid var(--border); border-radius:8px; padding:9px 12px; margin-bottom:16px; }
    /* Guest landing hero */
    .landing { max-width:900px; margin:0 auto; }
    .hero { text-align:center; padding:16px 0 4px; }
    .eyebrow { display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--teal); background:var(--teal-muted); border:1px solid rgba(0,212,200,0.25); padding:5px 13px; border-radius:20px; margin-bottom:16px; }
    .hero h1 { font-size:30px; line-height:1.2; color:var(--white); max-width:730px; margin:0 auto 14px; letter-spacing:-0.5px; }
    .hero .lede { font-size:15px; color:var(--light); max-width:660px; margin:0 auto; line-height:1.65; }
    .features { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:26px 0 12px; }
    .feature { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:left; }
    .feature .fi { font-size:20px; margin-bottom:8px; }
    .feature h4 { font-size:13.5px; color:var(--white); margin-bottom:5px; }
    .feature p { font-size:12px; color:var(--slate); line-height:1.5; }
    .engine-note { text-align:center; font-size:12.5px; color:var(--slate); margin:4px auto 22px; max-width:660px; line-height:1.55; }
    .engine-note strong { color:var(--light); }
    @media (max-width:760px){ .features{ grid-template-columns:1fr 1fr; } .hero h1{ font-size:24px; } }
    /* Site nav in the workspace topbar */
    .site-nav { display:flex; gap:18px; }
    .site-nav a { font-size:13px; color:var(--slate); }
    .site-nav a:hover { color:var(--white); text-decoration:none; }
    @media (max-width:820px){ .site-nav { display:none; } }
    /* Field help + rationale */
    .info-i { display:inline-block; width:15px; height:15px; line-height:15px; text-align:center; border-radius:50%; background:rgba(255,255,255,0.08); color:var(--slate); font-size:10px; font-style:italic; font-weight:700; margin-left:6px; cursor:help; user-select:none; }
    .field .why { margin-top:8px; }
    .field .why summary { cursor:pointer; font-size:11.5px; font-weight:600; color:var(--teal); list-style:none; display:inline-block; }
    .field .why summary::-webkit-details-marker { display:none; }
    .field .why summary::before { content:'▸ '; }
    .field .why[open] summary::before { content:'▾ '; }
    .field .why-body { font-size:12px; color:var(--light); margin-top:6px; line-height:1.55; background:rgba(0,0,0,0.2); border-left:2px solid var(--teal-dark); padding:9px 11px; border-radius:0 6px 6px 0; white-space:pre-wrap; }
    /* Auth modal overlay */
    .modal-overlay { position:fixed; inset:0; background:rgba(5,12,24,0.74); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
    .modal-overlay.hidden { display:none; }
    .modal-card { background:var(--navy-mid); border:1px solid var(--border); border-radius:14px; padding:28px; width:100%; max-width:410px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    .modal-card h1 { font-size:20px; color:var(--white); margin-bottom:4px; }
    .modal-card .sub { font-size:13px; color:var(--slate); margin-bottom:18px; line-height:1.5; }
    .modal-close { position:absolute; top:10px; right:14px; background:none; border:none; color:var(--slate); font-size:22px; line-height:1; cursor:pointer; }
    .modal-close:hover { color:var(--white); }
    @media (max-width:760px){ .layout{ grid-template-columns:1fr; } .sidebar{ border-right:none; border-bottom:1px solid var(--border);} }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="row" style="gap:24px">
      <a href="/app" class="brand">AE <span>Connect</span></a>
      <nav class="site-nav">
        <a href="/features">Features</a>
        <a href="/blog">Blog</a>
        <a href="/beta">Beta</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
    <div class="top-right" id="topRight"></div>
  </div>

  <!-- AUTH MODAL (shown on demand) -->
  <div id="authModal" class="modal-overlay hidden" data-action="auth-backdrop">
    <div class="modal-card">
      <button type="button" class="modal-close" data-action="close-auth" aria-label="Close">×</button>
      <h1>Save your assessment</h1>
      <p class="sub" id="authSubtitle">Create your free account to see the AI assessment. First 5 cases free — no card.</p>
      <div class="tabs">
        <button type="button" id="tabSignup" class="active" data-action="set-mode" data-mode="signup">Sign up</button>
        <button type="button" id="tabLogin" data-action="set-mode" data-mode="login">Log in</button>
      </div>
      <div id="nameField">
        <label>Full name</label>
        <input id="f_name" autocomplete="name" placeholder="Dr. Jane Doe" />
      </div>
      <label>Email</label>
      <input id="f_email" type="email" autocomplete="username" placeholder="you@company.com" />
      <label>Password</label>
      <input id="f_password" type="password" autocomplete="current-password" placeholder="••••••••" />
      <button type="button" class="btn btn-primary full" id="authBtn" data-action="submit-auth">Create account</button>
      <div class="err" id="authErr"></div>
      <div id="forgotRow" class="hidden">
        <button type="button" class="text-btn" data-action="toggle-forgot">Forgot password?</button>
        <div id="forgotBox" class="hidden">
          <p class="sub">If an account exists for the email above, we'll send a reset link.</p>
          <button type="button" class="btn btn-ghost full" data-action="request-reset">Send reset link</button>
          <div class="err" id="forgotMsg"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- APP VIEW (always shown — workspace is the landing page) -->
  <div id="appView" class="layout">
    <aside class="sidebar">
      <button type="button" class="btn btn-primary" style="width:100%;margin-bottom:16px" data-action="new-case">+ New case</button>
      <h3>Your cases</h3>
      <div id="caseList"></div>
    </aside>
    <main class="main" id="mainPanel"></main>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>
