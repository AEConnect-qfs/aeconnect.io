[build]
  publish = "."
  functions = "netlify/functions"
  command = "npx prisma generate"

# IndexNow key file: /ca06112e4d97f820b16bd05adafbc2e8.txt
# The file body is the key. onSuccess submits sitemap URLs after a production deploy.
[[plugins]]
package = "./netlify/plugins/indexnow"

[build.environment]
  NODE_VERSION = "20"

# Directory indexes are the canonical URLs (`/blog/`, `/contact/`).
[build.processing.html]
  pretty_urls = true

[functions]
  # Prisma query engine must be bundled with each function.
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/client/*", "prisma/schema.prisma"]

[template.environment]
  EMAIL_OBFUSCATION = "off"

# HTTP and www → the canonical https apex. Path is preserved.
# Netlify also forces HTTPS at the edge; these rules keep the choice in-repo.
[[redirects]]
  from = "http://aeconnect.io/*"
  to = "https://aeconnect.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.aeconnect.io/*"
  to = "https://aeconnect.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.aeconnect.io/*"
  to = "https://aeconnect.io/:splat"
  status = 301
  force = true

# Self-serve AI workspace API → Netlify Functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Previously indexed URLs that are not in this repo. Send them to the closest page.
[[redirects]]
  from = "/blog/meddra-coding-at-intake-ai-pharmacovigilance"
  to = "/blog/the-missing-layer-in-pharmacovigilance-ae-connect/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/meddra-coding-at-intake-ai-pharmacovigilance/"
  to = "/blog/the-missing-layer-in-pharmacovigilance-ae-connect/"
  status = 301
  force = true

