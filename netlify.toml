[build]
  publish = "."
  functions = "netlify/functions"
  command = "npx prisma generate"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Prisma query engine must be bundled with each function.
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/client/*", "prisma/schema.prisma"]

[template.environment]
  EMAIL_OBFUSCATION = "off"

# HTTP and www → the canonical https apex. Path is preserved.
# Netlify also forces HTTPS at the edge; these rules keep the choice in-repo.
[[redirects]]
  from = "http://aeconnect.io/*"
  to = "https://aeconnect.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.aeconnect.io/*"
  to = "https://aeconnect.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.aeconnect.io/*"
  to = "https://aeconnect.io/:splat"
  status = 301
  force = true

# Self-serve AI workspace API → Netlify Functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Previously indexed URLs that are not in this repo. Send them to the closest page.
[[redirects]]
  from = "/blog/meddra-coding-at-intake-ai-pharmacovigilance"
