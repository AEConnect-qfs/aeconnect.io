# Trailing-slash canonicals are not forced here. Netlify matches `/blog` and
# `/blog/` as the same redirect path, so a force 301 from one to the other
# loops the slash URL onto itself. Pretty URLs already 301 the non-slash form
# to the directory index once; the slash form is a 200.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
    # includeSubDomains covers hosts such as app.aeconnect.io. They must stay on HTTPS.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net; manifest-src 'self'; media-src 'self' blob:; upgrade-insecure-requests"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/downloads/ae-intake-readiness-checklist.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/resources/ae-intake-checklist/thanks"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/resources/ae-intake-checklist/thanks/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/trial/thanks"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/trial/thanks/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/blog/veeva-argus-overkill-early-phase-biotech/*"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
