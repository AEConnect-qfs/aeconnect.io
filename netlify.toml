[build]
  publish = "."
  functions = "netlify/functions"
  command = "npx prisma generate"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Prisma query engine must be bundled with each function.
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/client/*", "prisma/schema.prisma"]

[template.environment]
  EMAIL_OBFUSCATION = "off"

# Self-serve AI workspace API → Netlify Functions.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Clean URL for the workspace app.
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

# AI Workspace is the homepage — serve it at the root (URL stays aeconnect.io).
# `force` overrides the static index.html. Other pages (/features, /blog, …) are unaffected.
[[redirects]]
  from = "/"
  to = "/app/index.html"
  status = 200
  force = true

[[headers]]
  for = "/blog/veeva-argus-overkill-early-phase-biotech"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
